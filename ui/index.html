<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traza</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='%23C65D3B'%3E%3Crect x='2' y='10' width='30' height='5' rx='1.5'/%3E%3Crect x='16' y='19' width='22' height='5' rx='1.5'/%3E%3Crect x='20' y='28' width='16' height='5' rx='1.5'/%3E%3Crect x='24' y='37' width='20' height='5' rx='1.5'/%3E%3C/svg%3E" />
    <script>
      // Theme before first paint: stored choice, else OS preference.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('traza_theme'); } catch (e) {}
        var dark = stored ? stored === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
