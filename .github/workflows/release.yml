name: Release

# A tag push produces the install: one archive per platform carrying the
# static server binary and the dashboard's build output, a multi-arch
# container image built from the same binaries, checksums, and build
# provenance. Linux binaries are musl-static so there is no libc to match.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  ui:
    name: Build the dashboard once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci && npm run build
        run: |
          cd ui
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  binaries:
    name: ${{ matrix.name }}
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build traza-server
        run: cargo build --release --locked --bin traza-server --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - name: Assemble the archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="traza-${version}-${{ matrix.name }}"
          mkdir -p "stage/${pkg}/ui"
          cp "target/${{ matrix.target }}/release/traza-server" "stage/${pkg}/"
          cp -R ui-dist "stage/${pkg}/ui/dist"
          cp README.md LICENSE NOTICE CHANGELOG.md "stage/${pkg}/"
          tar -C stage -czf "${pkg}.tar.gz" "${pkg}"
          shasum -a 256 "${pkg}.tar.gz"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "traza-*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.name }}
          path: "traza-*.tar.gz"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/traza-server
          if-no-files-found: error

  container:
    name: Multi-arch image to GHCR
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-x86_64
          path: stage/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-aarch64
          path: stage/arm64
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: stage/ui-dist
      - name: Restore the executable bit artifacts drop
        run: chmod +x stage/amd64/traza-server stage/arm64/traza-server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    name: Publish the GitHub release
    needs: [binaries, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum traza-*.tar.gz > SHA256SUMS
      - name: Release notes are the changelog section, not a rewrite of it
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '/^## \[/{p = index($0, "[" ver "]") > 0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" traza-*.tar.gz SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (skips when no token secret is set)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish."
            exit 0
          fi
          cargo publish --locked
