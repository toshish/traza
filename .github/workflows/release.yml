name: Release

# A tag push produces the install: one archive per platform carrying the
# static server binary and the dashboard's build output, a multi-arch
# container image built from the same binaries, checksums, and build
# provenance. Linux binaries are musl-static so there is no libc to match.
#
# The pipeline validates every prerequisite before it publishes anywhere.
# Preflight refuses a tag whose version disagrees with Cargo.toml,
# ui/package.json, or the CHANGELOG; runs the full ./ci.sh gate on BOTH
# platforms plus the MSRV check; verifies the crates.io token is present and
# the crate packages cleanly — all before a single artifact is built. True
# atomicity across three registries is not a thing, so the ordering makes
# the GitHub release the LAST act: if a publication step fails, the repo is
# not left advertising a release that only partially exists. Every archive
# is smoke-tested from an UNRELATED working directory — v0.22.0 shipped a
# dashboard 404 only visible when launched from elsewhere, and that class
# of bug does not get a second chance. Actions are pinned to commit SHAs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  preflight:
    name: Full gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag names one version, everywhere
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ui_v=$(python3 -c 'import json; print(json.load(open("ui/package.json"))["version"])')
          fail=0
          [ "$version" = "$cargo_v" ] || { echo "tag ${version} != Cargo.toml ${cargo_v}"; fail=1; }
          [ "$version" = "$ui_v" ] || { echo "tag ${version} != ui/package.json ${ui_v}"; fail=1; }
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "CHANGELOG.md has no [${version}] section"; fail=1; }
          exit $fail
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Run the merge bar on the tagged commit
        run: ./ci.sh

  preflight-msrv:
    name: MSRV holds on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked

  preflight-crates:
    name: crates.io can publish before anything does
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The token exists, or nothing gets built
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Every expected channel must be able to"
            echo "::error::publish BEFORE any channel does; add the secret (Settings → Secrets →"
            echo "::error::Actions) and push the tag again."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The crate packages and builds as it will publish
        run: cargo publish --dry-run --locked

  ui:
    name: Build the dashboard once
    needs: [preflight, preflight-msrv, preflight-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: npm ci && npm run build
        run: |
          cd ui
          npm ci
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  binaries:
    name: ${{ matrix.name }}
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build traza-server
        run: cargo build --release --locked --bin traza-server --target ${{ matrix.target }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui-dist
      - name: Assemble the archive (dashboard at ui/, the packaging convention the server probes)
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="traza-${version}-${{ matrix.name }}"
          mkdir -p "stage/${pkg}"
          cp "target/${{ matrix.target }}/release/traza-server" "stage/${pkg}/"
          cp -R ui-dist "stage/${pkg}/ui"
          cp README.md LICENSE NOTICE THIRD_PARTY_NOTICES.md CHANGELOG.md "stage/${pkg}/"
          tar -C stage -czf "${pkg}.tar.gz" "${pkg}"
          shasum -a 256 "${pkg}.tar.gz"
      - name: Smoke-test the archive from an unrelated directory
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="traza-${version}-${{ matrix.name }}"
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP/smoke" -xzf "${pkg}.tar.gz"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/${pkg}/traza-server" --data-dir "$RUNNER_TEMP/smoke-data" --port 18123 &
          server=$!
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:18123/v1/stats && break
            sleep 0.5
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18123/)
          body=$(curl -s -X POST http://127.0.0.1:18123/v1/spans -H 'Content-Type: application/json' \
            -d '[{"trace_id":"smoke","span_id":"s1","name":"smoke","service":"smoke","start_time_unix_nano":1,"end_time_unix_nano":2,"status":"ok"}]')
          got=$(curl -s http://127.0.0.1:18123/v1/traces/smoke)
          kill $server
          [ "$code" = "200" ] || { echo "dashboard did not serve from an unrelated cwd: HTTP $code"; exit 1; }
          echo "$body" | grep -q '"accepted":1' || { echo "ingest failed: $body"; exit 1; }
          echo "$got" | grep -q '"span_id":"s1"' || { echo "read-back failed: $got"; exit 1; }
          echo "smoke ok: dashboard 200, span accepted and read back"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "traza-*.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.name }}
          path: "traza-*.tar.gz"
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/traza-server
          if-no-files-found: error

  container:
    name: Multi-arch image to GHCR
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bin-linux-x86_64
          path: stage/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bin-linux-aarch64
          path: stage/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: stage/ui-dist
      - name: Restore the executable bit artifacts drop
        run: chmod +x stage/amd64/traza-server stage/arm64/traza-server
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  crates:
    name: Publish to crates.io
    needs: [binaries, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: cargo publish
        run: cargo publish --locked

  release:
    name: Publish the GitHub release, last
    needs: [binaries, container, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archive-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum traza-*.tar.gz > SHA256SUMS
      - name: Release notes are the changelog section, not a rewrite of it
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '/^## \[/{p = index($0, "[" ver "]") > 0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" traza-*.tar.gz SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
